<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ding! • The Most Beautiful To-Do App Ever Made</title>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
/* GOOGLE FONT */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

:root {
  --bg: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 100%);
  --card: rgba(255, 255, 255, 0.18);
  --text: #ffffff;
  --accent: #a78bfa;
  --done: #c084fc;
  --shadow: 0 20px 40px rgba(0,0,0,0.3);
}

/* THEMES — FIXED */
[data-theme="sakura"] {
  --bg: linear-gradient(135deg,#ff9a9e 0%,#fecfef 100%);
  --accent:#ff6b9d; 
  --done:#ff8fab;
}

[data-theme="matcha"] {
  --bg: linear-gradient(135deg,#a8e6cf 0%,#dcedc1 50%,#ffd3a5 100%);
  --accent:#88b06e; 
  --done:#a8e6cf;
  --text:#2d2d2d;
}

[data-theme="ocean"] {
  --bg: linear-gradient(135deg,#00c9ff 0%,#92fe9d 100%);
  --accent:#00c9ff; 
  --done:#92fe9d;
}

[data-theme="sunset"] {
  --bg: linear-gradient(135deg,#ff6e7f 0%,#bfe9ff 100%);
  --accent:#ff8e8e; 
  --done:#ffb3b3;
}

[data-theme="midnight"] {
  --bg: linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  --accent:#bb86fc; 
  --done:#03dac6;
  --card:rgba(255,255,255,0.08);
}

[data-theme="peach"] {
  --bg: linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);
  --accent:#ff8b6f; 
  --done:#ffb996;
  --text:#4a2c2a;
}

/* GENERAL */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-attachment:fixed;
  overflow-x:hidden;
  transition:all .7s cubic-bezier(0.22,1,0.36,1);
}

.container { max-width:560px; margin:auto; padding:20px; }

header { text-align:center; padding:40px 0 20px; }

h1 {
  font-size:4.5rem;
  font-weight:900;
  background:linear-gradient(90deg,#fff,#ddd);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.tagline { font-size:1.3rem; opacity:.9; font-weight:300; margin-top:10px }

/* THEME SWITCHER */
.theme-switcher {
  position:fixed; top:20px; right:20px;
  display:flex; gap:10px;
  background:rgba(0,0,0,.2);
  padding:12px; border-radius:50px; z-index:100;
}

.theme-dot {
  width:36px; height:36px; border-radius:50%; cursor:pointer;
  transition:.3s; box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.theme-dot:hover { transform:scale(1.3); }

/* STATS BAR */
.stats-bar {
  display:flex; justify-content:space-around;
  margin:30px 0; flex-wrap:wrap; gap:15px;
}

.stat-card {
  background:var(--card);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:20px;
  min-width:120px;
  text-align:center;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,0.2);
}

.stat-card big {
  font-size:2.8rem; font-weight:900;
}

/* PROGRESS RING */
.progress-ring { width:110px; height:110px; position:relative; margin:auto; }

.progress-ring circle {
  cx:55; cy:55; r:50;
  fill:none; stroke-width:10; stroke-linecap:round;
  transform:rotate(-90deg); transform-origin:55px 55px;
}

.bg { stroke:rgba(255,255,255,.2); }
.fg { stroke:url(#gradient); transition:stroke-dashoffset 1s ease; }

/* INPUT */
.input-box { display:flex; gap:12px; margin:30px 0; }

#taskInput {
  flex:1; padding:20px 24px; font-size:1.2rem; background:var(--card);
  border:none; border-radius:30px; backdrop-filter:blur(20px);
  color:var(--text); box-shadow:var(--shadow); transition:.4s;
}

#addBtn {
  width:66px; height:66px; border-radius:50%;
  background:var(--accent); color:white; font-size:2rem;
  border:none; cursor:pointer; box-shadow:var(--shadow);
}

#addBtn:hover { transform:scale(1.15) rotate(90deg); }

/* TASK LIST */
#taskList { list-style:none; }

.task {
  background:var(--card);
  backdrop-filter:blur(20px);
  margin:16px 0; padding:20px 24px;
  border-radius:24px;
  display:flex; align-items:center; gap:16px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,0.15);
  transition:all .6s cubic-bezier(.175,.885,.32,1.275);
  opacity:0; transform:translateY(40px);
}

.task.show { opacity:1; transform:translateY(0); }

.task-text {
  flex:1; font-size:1.25rem; font-weight:500; cursor:pointer;
}

.task.done .task-text { text-decoration:line-through; }

.task.done {
  background:linear-gradient(135deg,rgba(192,132,252,.3),rgba(130,222,255,.2));
  opacity:.6;
}

.delete-btn {
  width:44px; height:44px; border-radius:50%;
  background:#ff6b6b; color:white; border:none;
  font-size:1.4rem; cursor:pointer;
}

/* POMODORO */
.pomodoro {
  text-align:center; margin:40px 0; padding:30px;
  background:var(--card); backdrop-filter:blur(20px);
  border-radius:30px; box-shadow:var(--shadow);
}

#timerDisplay { font-size:4rem; font-weight:900; margin:20px 0; }

.timer-btn {
  padding:12px 28px; margin:0 8px; border:none;
  border-radius:50px; background:var(--accent); color:white;
  font-weight:bold; cursor:pointer;
}

/* MOOD */
.mood-bar { display:flex; justify-content:center; gap:12px; margin:30px 0; }

.mood-btn {
  font-size:2.5rem; background:none; border:none;
  cursor:pointer; transition:.3s; padding:10px;
}

.mood-btn:hover { transform:scale(1.3); }
</style>
</head>

<body>

<!-- Theme Switcher -->
<div class="theme-switcher">
  <div class="theme-dot" style="background:#ff9a9e" data-theme="sakura"></div>
  <div class="theme-dot" style="background:#a8e6cf" data-theme="matcha"></div>
  <div class="theme-dot" style="background:#00c9ff" data-theme="ocean"></div>
  <div class="theme-dot" style="background:#ff6e7f" data-theme="sunset"></div>
  <div class="theme-dot" style="background:#24243e" data-theme="midnight"></div>
  <div class="theme-dot" style="background:#ffecd2" data-theme="peach"></div>
</div>

<div class="container">

<header>
  <h1>Ding!</h1>
  <p class="tagline">Every completed task feels like magic</p>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <big id="todayCount">0</big>
    <div>Done Today</div>
  </div>

  <div class="stat-card">
    <div class="progress-ring">
      <svg width="110" height="110">
        <defs>
          <linearGradient id="gradient">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#818cf8"/>
          </linearGradient>
        </defs>
        <circle class="bg" r="50" cx="55" cy="55"/>
        <circle class="fg" r="50" cx="55" cy="55" stroke-dasharray="314" stroke-dashoffset="314"/>
      </svg>
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:bold;">
        <span id="progressText">0/8</span>
      </div>
    </div>
    <div>Daily Quest</div>
  </div>

  <div class="stat-card">
    <big id="streakCount">0</big><span style="font-size:2rem;">🔥</span>
    <div>Streak</div>
  </div>
</div>

<!-- Input -->
<div class="input-box">
  <input type="text" id="taskInput" placeholder="What will spark joy today?"/>
  <button id="addBtn">+</button>
</div>

<ul id="taskList"></ul>

<!-- Pomodoro -->
<div class="pomodoro">
  <h3>Focus Mode</h3>
  <div id="timerDisplay">25:00</div>
  <button class="timer-btn" id="startTimer">Start</button>
  <button class="timer-btn" id="resetTimer">Reset</button>
</div>

<!-- Mood -->
<div style="text-align:center;margin:30px 0;">
  <p>How do you feel right now?</p>
  <div class="mood-bar">
    <button class="mood-btn">😴</button>
    <button class="mood-btn">😐</button>
    <button class="mood-btn">🙂</button>
    <button class="mood-btn">😄</button>
    <button class="mood-btn">⚡</button>
  </div>
</div>

</div>

<!-- Sounds -->
<audio id="ding" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-complete-or-approved-mission-205.mp3" preload="auto"></audio>
<audio id="levelup" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" preload="auto"></audio>
<audio id="whoosh" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-swoosh-1065.mp3" preload="auto"></audio>

<script>
/* STATE */
let tasks = JSON.parse(localStorage.getItem("dingUltimate") || "[]");
const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const ding = document.getElementById("ding");
const levelup = document.getElementById("levelup");
const whoosh = document.getElementById("whoosh");
const todayCountEl = document.getElementById("todayCount");
const streakEl = document.getElementById("streakCount");
const progressText = document.getElementById("progressText");
const progressCircle = document.querySelector(".fg");
const timerDisplay = document.getElementById("timerDisplay");

const DAILY_GOAL = 8;

/* STREAK */
let streak = Number(localStorage.getItem("dingStreak") || 0);
let lastDate = localStorage.getItem("dingDate") || "";
const today = new Date().toISOString().slice(0,10);

if (lastDate !== today) {
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  streak = (lastDate === yesterday) ? streak + 1 : 1;
  localStorage.setItem("dingStreak", streak);
  localStorage.setItem("dingDate", today);
}
streakEl.textContent = streak;

/* THEME */
const savedTheme = localStorage.getItem("dingTheme");
document.body.dataset.theme = savedTheme || "midnight";

document.querySelectorAll(".theme-dot").forEach(dot => {
  dot.addEventListener("click", () => {
    document.body.dataset.theme = dot.dataset.theme;
    localStorage.setItem("dingTheme", dot.dataset.theme);
  });
});

/* ADD TASK */
addBtn.addEventListener("click", addTask);
taskInput.addEventListener("keypress", e => {
  if (e.key === "Enter") addTask();
});

function addTask() {
  const text = taskInput.value.trim();
  if (!text) return;

  const task = { text, done:false, id:Date.now() };
  tasks.unshift(task);
  renderTask(task);
  save();
  updateStats();
  taskInput.value = "";
}

/* RENDER TASK */
function renderTask(task) {
  const li = document.createElement("li");
  li.className = "task";
  li.innerHTML = `
    <span class="task-text">${task.text}</span>
    <button class="delete-btn">×</button>
  `;

  if (task.done) li.classList.add("done");

  li.querySelector(".task-text").addEventListener("click", () => {
    task.done = !task.done;
    li.classList.toggle("done");
    if (task.done) completeTask();
    save();
    updateStats();
  });

  li.querySelector(".delete-btn").addEventListener("click", () => {
    whoosh.play();
    li.style.transform = "translateX(120%)";
    li.style.opacity = "0";
    setTimeout(() => {
      li.remove();
      tasks = tasks.filter(t => t.id !== task.id);
      save();
      updateStats();
    }, 500);
  });

  taskList.prepend(li);
  setTimeout(() => li.classList.add("show"), 20);
}

function completeTask() {
  ding.currentTime = 0;
  ding.play();
  confetti({ particleCount:120, spread:65, origin:{y:0.6} });
}

/* UPDATE STATS */
function updateStats() {
  const done = tasks.filter(t => t.done).length;
  todayCountEl.textContent = done;

  const progress = Math.min(done / DAILY_GOAL, 1) * 314;
  progressCircle.style.strokeDashoffset = 314 - progress;
  progressText.textContent = `${done}/${DAILY_GOAL}`;

  if (done === DAILY_GOAL) {
    levelup.play();
    confetti({ particleCount:250, spread:120 });
  }
}

function save() {
  localStorage.setItem("dingUltimate", JSON.stringify(tasks));
}

tasks.forEach(renderTask);
updateStats();

/* POMODORO */
let pomodoroTime = 25 * 60;
let timerInterval = null;

document.getElementById("startTimer").addEventListener("click", () => {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (pomodoroTime <= 0) {
      clearInterval(timerInterval);
      levelup.play();
      confetti({ particleCount:200, spread:100 });
      return;
    }
    pomodoroTime--;
    updateTimerDisplay();
  }, 1000);
});

document.getElementById("resetTimer").addEventListener("click", () => {
  clearInterval(timerInterval);
  pomodoroTime = 25 * 60;
  updateTimerDisplay();
});

function updateTimerDisplay() {
  const m = String(Math.floor(pomodoroTime/60)).padStart(2,"0");
  const s = String(pomodoroTime%60).padStart(2,"0");
  timerDisplay.textContent = `${m}:${s}`;
}

/* MOOD BUTTONS */
document.querySelectorAll(".mood-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    confetti({ particleCount:40, spread:40, origin:{y:0.8} });
  });
});
</script>

</body>
</html>
